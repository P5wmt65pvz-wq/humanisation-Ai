<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coup de pouce</title>
<meta name="description" content="Choisis ta matière, ta classe et ce dont tu as besoin : ton prompt de révision est prêt à coller dans ChatGPT ou Claude. Gratuit, sans compte, rien n'est envoyé.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05060B">
<style>
/* Layout : un seul écran sans défilement. Goutte de lumière liquide derrière le titre ; puces matière et classe ; 6 besoins cumulables ; un gros bouton Copier. */
@font-face{font-family:"Instrument Serif";src:url(polices/instrument-serif.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url(polices/instrument-serif-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Manrope";src:url(polices/manrope.woff2) format("woff2");font-weight:200 800;font-style:normal;font-display:swap}
:root{
  color-scheme:dark;
  --night:#05060B; --glass:rgba(255,255,255,.06); --glass-hi:rgba(255,255,255,.11); --edge:rgba(255,255,255,.14);
  --text:#F4F6FF; --soft:#A8AEC8; --blue:#2F5BFF; --cyan:#3FE6F2; --pink:#F03FB4; --violet:#8B5CFF;
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{overflow-x:clip;height:100%}
body{margin:0;min-height:100%;background:var(--night);color:var(--text);font-family:var(--body);overflow-x:clip}
main{position:relative;max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:14px;
  padding-block:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{position:relative;text-align:center;padding-top:6px}
.drop{position:absolute;left:50%;top:44%;width:300px;aspect-ratio:1;margin:-150px 0 0 -150px;z-index:-1;pointer-events:none;
  background:conic-gradient(from 0deg,var(--blue),var(--cyan),var(--violet),var(--pink),var(--blue));filter:blur(40px) saturate(1.2) hue-rotate(var(--hue,0deg));opacity:.7;
  border-radius:42% 58% 63% 37% / 41% 44% 56% 59%;animation:morph 12s ease-in-out infinite,spin 24s linear infinite;transition:filter 1.2s ease}
@keyframes morph{0%,100%{border-radius:42% 58% 63% 37% / 41% 44% 56% 59%}33%{border-radius:63% 37% 45% 55% / 55% 61% 39% 45%}66%{border-radius:38% 62% 56% 44% / 62% 38% 62% 38%}}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(52px,15vw,76px);line-height:.9;letter-spacing:-.02em}
h1 em{display:block;font-size:.36em;margin-top:.3em;letter-spacing:0}
.label{margin:0 0 7px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;font-weight:600;color:var(--text);background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:7px 12px;cursor:pointer;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:background .2s,border-color .2s,box-shadow .2s}
.chip[aria-pressed="true"]{background:rgba(63,230,242,.16);border-color:var(--cyan);box-shadow:0 0 18px -6px var(--cyan)}
.needs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.need{position:relative;text-align:left;font:inherit;color:var(--text);background:linear-gradient(160deg,var(--glass-hi),var(--glass));border:1px solid var(--edge);border-radius:16px;
  padding:10px 12px;cursor:pointer;overflow:hidden;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:border-color .2s,box-shadow .2s}
.need strong{display:block;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.05}
.need small{display:block;font-size:12.5px;color:var(--soft);margin-top:2px}
.need .tick{position:absolute;top:9px;right:10px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--edge);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--night)}
.need[aria-pressed="true"]{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 26px -10px var(--cyan)}
.need[aria-pressed="true"] .tick{background:var(--cyan);border-color:var(--cyan)}
.chip:focus-visible,.need:focus-visible,.go:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.go{margin-top:auto;font:inherit;font-size:17px;font-weight:800;color:var(--night);background:linear-gradient(90deg,var(--cyan),#8FB6FF 50%,#F48FD2);border:0;border-radius:999px;padding:15px 20px;cursor:pointer;
  box-shadow:0 10px 40px -12px rgba(63,230,242,.8)}
.go:disabled{opacity:.45;cursor:default;box-shadow:none}
.foot{margin:0;text-align:center;font-size:11.5px;color:#7D84A3}
.foot a{color:#A8AEC8}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);z-index:5;width:min(520px,calc(100% - 32px));
  background:rgba(20,22,36,.9);border:1px solid var(--edge);border-radius:20px;padding:14px 16px;display:grid;gap:10px;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 20px 60px -10px rgba(0,0,0,.8);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.toast.on{transform:translate(-50%,0)}
.toast p{margin:0;font-weight:800}
.toast span{font-size:14px;color:var(--soft)}
.toast .links{display:flex;gap:8px;flex-wrap:wrap}
.toast a{font-size:14px;font-weight:700;text-decoration:none;color:var(--text);border:1px solid var(--cyan);border-radius:999px;padding:8px 14px}
@media (max-height:700px){h1{font-size:46px}.need small{display:none}.chip{padding:6px 10px;font-size:13px}}
@media (prefers-reduced-motion:reduce){.drop{animation:none}.toast,.chip,.need{transition:none}}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="drop" id="drop" aria-hidden="true"></div>
    <h1>Coup de pouce<em>ton prof particulier, prêt à coller.</em></h1>
  </header>

  <section aria-labelledby="l-mat">
    <p class="label" id="l-mat">Matière</p>
    <div class="chips" data-group="matiere" role="group" aria-labelledby="l-mat">
      <button type="button" class="chip">Maths</button><button type="button" class="chip">Français</button><button type="button" class="chip">Physique-chimie</button><button type="button" class="chip">SVT</button><button type="button" class="chip">Histoire-géo</button><button type="button" class="chip">Anglais</button><button type="button" class="chip">Espagnol</button><button type="button" class="chip">SES</button><button type="button" class="chip">Philo</button>
    </div>
  </section>

  <section aria-labelledby="l-cl">
    <p class="label" id="l-cl">Classe</p>
    <div class="chips" data-group="classe" role="group" aria-labelledby="l-cl">
      <button type="button" class="chip">Collège</button><button type="button" class="chip">Seconde</button><button type="button" class="chip">Première</button><button type="button" class="chip">Terminale</button><button type="button" class="chip">Études sup</button>
    </div>
  </section>

  <section aria-labelledby="l-need">
    <p class="label" id="l-need">Ce que tu veux (plusieurs possibles)</p>
    <div class="needs">
      <button type="button" class="need" data-k="comprendre" aria-pressed="false"><span class="tick" aria-hidden="true">✓</span><strong>Comprendre</strong><small>Explication simple</small></button>
      <button type="button" class="need" data-k="quiz" aria-pressed="false"><span class="tick" aria-hidden="true">✓</span><strong>Quiz</strong><small>Noté sur 20</small></button>
      <button type="button" class="need" data-k="fiche" aria-pressed="false"><span class="tick" aria-hidden="true">✓</span><strong>Fiche</strong><small>Le cours sur une page</small></button>
      <button type="button" class="need" data-k="exo" aria-pressed="false"><span class="tick" aria-hidden="true">✓</span><strong>Exercice</strong><small>Avec indices</small></button>
      <button type="button" class="need" data-k="planning" aria-pressed="false"><span class="tick" aria-hidden="true">✓</span><strong>Planning</strong><small>Jusqu'au contrôle</small></button>
      <button type="button" class="need" data-k="oral" aria-pressed="false"><span class="tick" aria-hidden="true">✓</span><strong>Oral</strong><small>L'IA joue le jury</small></button>
    </div>
  </section>

  <button type="button" class="go" id="go">Copier mon prompt</button>
  <p class="foot">L'IA peut se tromper : vérifie avec ton cours. Rien n'est envoyé depuis cette page. <a href="https://p5wmt65pvz-wq.github.io/humanisation-Ai/mentions-legales.html">Mentions légales</a></p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <p id="t-msg">Copié ✓</p>
  <span id="t-why">Colle-le dans ton IA : elle te demandera ton chapitre.</span>
  <div class="links"><a href="https://chatgpt.com/" target="_blank" rel="noopener">Ouvrir ChatGPT</a><a href="https://claude.ai/new" target="_blank" rel="noopener">Ouvrir Claude</a></div>
</div>

<script>
(function(){
  var NEED={
    comprendre:"Explique-moi la notion simplement, comme si j'avais 12 ans, avec un exemple de la vie de tous les jours (10 lignes maximum). Puis pose-moi une question pour vérifier que j'ai compris ; si je me trompe, réexplique autrement.",
    quiz:"Fais-moi passer un quiz de 10 questions comme en contrôle. Une question à la fois ; après chaque réponse, dis si c'est juste et corrige en une phrase. À la fin, une note sur 20 et les 2 notions à revoir.",
    fiche:"Fais-moi une fiche d'une page : les notions clés, les définitions et formules à savoir, les pièges classiques en contrôle, et un mini-exemple corrigé. Si je colle mon cours, base-toi uniquement dessus.",
    exo:"Donne-moi un exercice du type contrôle, sans la correction. Si je bloque, donne un indice, puis un deuxième. Quand j'ai fini, corrige étape par étape et propose-en un plus dur.",
    planning:"Demande-moi la date du contrôle et combien de minutes je peux réviser par jour, puis fais-moi un planning avec une tâche précise par jour, un quiz l'avant-veille et rien de nouveau la veille.",
    oral:"Joue le jury d'un oral : pose une question à la fois, attends ma réponse, puis dis-moi ce qui était clair, ce qui manquait et comment mieux le dire."
  };
  var HUE={comprendre:0,quiz:70,fiche:-40,exo:30,planning:-80,oral:110};
  var KEY='coupdepouce.v1',state={matiere:'Maths',classe:'Seconde',needs:['comprendre','quiz']};
  try{var sv=JSON.parse(localStorage.getItem(KEY));if(sv&&sv.needs)state=sv;}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  var drop=document.getElementById('drop'),go=document.getElementById('go');
  [].forEach.call(document.querySelectorAll('.chips'),function(g){
    var key=g.dataset.group,chips=[].slice.call(g.querySelectorAll('.chip'));
    function paint(){chips.forEach(function(c){c.setAttribute('aria-pressed',String(c.textContent===state[key]));});}
    chips.forEach(function(c){c.addEventListener('click',function(){state[key]=c.textContent;paint();save();});});
    paint();
  });
  var needs=[].slice.call(document.querySelectorAll('.need'));
  function paintNeeds(){needs.forEach(function(n){n.setAttribute('aria-pressed',String(state.needs.indexOf(n.dataset.k)>-1));});
    go.disabled=!state.needs.length;go.textContent=state.needs.length?'Copier mon prompt':'Choisis au moins un besoin';}
  needs.forEach(function(n){n.addEventListener('click',function(){
    var k=n.dataset.k,i=state.needs.indexOf(k);
    if(i>-1)state.needs.splice(i,1);else{state.needs.push(k);drop.style.setProperty('--hue',HUE[k]+'deg');}
    paintNeeds();save();});});
  paintNeeds();
  function build(){
    var order=['comprendre','fiche','exo','quiz','planning','oral'].filter(function(k){return state.needs.indexOf(k)>-1;});
    var t="Tu es mon prof particulier de "+state.matiere+". Je suis en "+state.classe.toLowerCase()+".\n\nCommence par me demander sur quel chapitre je travaille (je pourrai aussi coller mon cours). Ensuite :\n";
    order.forEach(function(k,i){t+="\n"+(order.length>1?(i+1)+". ":"")+NEED[k];});
    t+="\n\nPose une seule question à la fois et attends ma réponse. Si tu n'es pas sûr d'une information, dis-le au lieu d'inventer.";
    return t;
  }
  var toast=document.getElementById('toast'),msg=document.getElementById('t-msg'),why=document.getElementById('t-why'),timer;
  function show(m,w){msg.textContent=m;why.textContent=w;toast.classList.add('on');clearTimeout(timer);timer=setTimeout(function(){toast.classList.remove('on');},6000);}
  function fallback(text){var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);return ok;}
  go.addEventListener('click',function(){
    var text=build();
    function ok(){show('Copié ✓','Colle-le dans ton IA : elle te demandera ton chapitre.');}
    function ko(){show('Copie bloquée','Ton navigateur refuse la copie : réessaie depuis Safari ou Chrome.');}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(ok,function(){fallback(text)?ok():ko();});
    else fallback(text)?ok():ko();
  });
})();
</script>
</body>
</html>
